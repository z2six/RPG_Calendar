// common/build.gradle
plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

repositories {
    // Modrinth Maven for optional compat mods used at compile-time (not bundled)
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

legacyForge {
    mcpVersion = minecraft_version
    def at = file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    compileOnly "org.jetbrains:annotations:24.1.0"

    // Optional compat mods (compile-time only). Do NOT bundle into your jar.
    compileOnly "maven.modrinth:serene-seasons:${serene_seasons_version}"
    compileOnly "maven.modrinth:legendary-tooltips:${legendary_tooltips_version}"
    compileOnly "maven.modrinth:tooltip-overhaul:${tooltip_overhaul_version}"

    // Legendary Tooltips required libraries (compile-time only, harmless if not used directly)
    compileOnly "maven.modrinth:iceberg:${iceberg_version}"
    compileOnly "maven.modrinth:prism-lib:${prism_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
