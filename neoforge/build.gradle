plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// NeoForge 1.21.x matrix profiles for Gradle panel tasks.
// These tasks let you quickly test compilation/runtime against multiple 1.21.x lines.
def neo121Profiles = [
    [id: "1_21_0",  mc: "1.21",    neoforge: "21.0.167", neoform: "1.21-20240613.152323"],
    [id: "1_21_1",  mc: "1.21.1",  neoforge: "21.1.219", neoform: "1.21.1-20240808.144430"],
    [id: "1_21_3",  mc: "1.21.3",  neoforge: "21.3.95",  neoform: "1.21.3-20241023.131943"],
    [id: "1_21_4",  mc: "1.21.4",  neoforge: "21.4.156", neoform: "1.21.4-20241203.161809"],
    [id: "1_21_5",  mc: "1.21.5",  neoforge: "21.5.96",  neoform: "1.21.5-20250325.162830"],
    [id: "1_21_8",  mc: "1.21.8",  neoforge: "21.8.52",  neoform: "1.21.8-20250717.133445"],
    [id: "1_21_10", mc: "1.21.10", neoforge: "21.10.64", neoform: "1.21.10-20251010.172816"]
]

def matrixProps = { profile ->
    [
        "minecraft_version": profile.mc,
        "neoforge_version": profile.neoforge,
        "neo_form_version": profile.neoform
    ]
}

def isWindowsOs = System.getProperty("os.name").toLowerCase().contains("windows")
def gradleCommandPrefix = isWindowsOs ? ["cmd", "/c", "gradlew.bat"] : ["./gradlew"]
def localGradleUserHome = new File(rootProject.projectDir, ".gradle-user-home").absolutePath

def registerMatrixExecTask = { String taskName, String groupName, String descriptionText, List<String> gradleTasks, Map<String, String> props ->
    tasks.register(taskName) {
        group = groupName
        description = descriptionText
        doLast {
            def argsList = []
            argsList.addAll(gradleCommandPrefix)
            argsList.addAll(gradleTasks)
            argsList += "--no-daemon"
            argsList += "--configure-on-demand"
            props.each { key, value ->
                argsList += "-P${key}=${value}"
            }
            project.exec {
                workingDir rootProject.projectDir
                environment "GRADLE_USER_HOME", localGradleUserHome
                commandLine argsList
            }
        }
    }
}

def matrixBuildTaskNames = []
neo121Profiles.each { profile ->
    def suffix = profile.id
    registerMatrixExecTask(
            "buildNeo_${suffix}",
            "build",
            "Builds NeoForge for Minecraft ${profile.mc}.",
            [":neoforge:build"],
            matrixProps(profile)
    )
    registerMatrixExecTask(
            "runClientNeo_${suffix}",
            "mod development",
            "Runs NeoForge client for Minecraft ${profile.mc}.",
            [":neoforge:runClient"],
            matrixProps(profile)
    )
    matrixBuildTaskNames << "buildNeo_${suffix}"
}

tasks.register("buildNeo_all_1_21_x") {
    group = "build"
    description = "Builds NeoForge against all configured 1.21.x profiles."
    dependsOn(matrixBuildTaskNames)
}

// Explicit run aliases for Minecraft patch versions that do not have their own NeoForge runtime line.
def runClientAliasMappings = [
    [id: "1_21_2", target: "1_21_1", runtimeMc: "1.21.1"],
    [id: "1_21_6", target: "1_21_5", runtimeMc: "1.21.5"],
    [id: "1_21_7", target: "1_21_8", runtimeMc: "1.21.8"],
    [id: "1_21_9", target: "1_21_8", runtimeMc: "1.21.8"]
]

runClientAliasMappings.each { alias ->
    def aliasLabel = alias.id.replace('_', '.')
    tasks.register("runClientNeo_${alias.id}") {
        group = "mod development"
        description = "Runs NeoForge client for Minecraft ${aliasLabel} (alias task; uses ${alias.runtimeMc} NeoForge runtime line)."
        dependsOn("runClientNeo_${alias.target}")
    }
}
