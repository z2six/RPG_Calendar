plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// NeoForge 1.21.0-1.21.2 matrix tasks (minimal set for this branch).
// Note: NeoForge has no dedicated 1.21.2 runtime line; 1.21.2 tasks use the 1.21.1 runtime line.
def neoProfiles = [
    [id: "1_21_0", label: "1.21.0", mc: "1.21",   neoforge: "21.0.167", neoform: "1.21-20240613.152323"],
    [id: "1_21_1", label: "1.21.1", mc: "1.21.1", neoforge: "21.1.219", neoform: "1.21.1-20240808.144430"],
    [id: "1_21_2", label: "1.21.2", mc: "1.21.1", neoforge: "21.1.219", neoform: "1.21.1-20240808.144430", aliasNote: "uses 1.21.1 NeoForge runtime line"]
]

def matrixProps = { profile ->
    [
        "minecraft_version": profile.mc,
        "neoforge_version": profile.neoforge,
        "neo_form_version": profile.neoform
    ]
}

def isWindowsOs = System.getProperty("os.name").toLowerCase().contains("windows")
def gradleCommandPrefix = isWindowsOs ? ["cmd", "/c", "gradlew.bat"] : ["./gradlew"]
def localGradleUserHome = new File(rootProject.projectDir, ".gradle-user-home").absolutePath

def runGradleWithProfile = { List<String> gradleTasks, Map<String, String> props ->
    def argsList = []
    argsList.addAll(gradleCommandPrefix)
    argsList.addAll(gradleTasks)
    argsList += "--no-daemon"
    argsList += "--configure-on-demand"
    props.each { key, value ->
        argsList += "-P${key}=${value}"
    }
    project.exec {
        workingDir rootProject.projectDir
        environment "GRADLE_USER_HOME", localGradleUserHome
        commandLine argsList
    }
}

def registerProfileTask = { String taskName, String groupName, String descriptionText, List<String> gradleTasks, Map<String, String> props ->
    tasks.register(taskName) {
        group = groupName
        description = descriptionText
        doLast {
            runGradleWithProfile(gradleTasks, props)
        }
    }
}

neoProfiles.each { profile ->
    registerProfileTask(
            "runClientNeo_${profile.id}",
            "mod development",
            "Runs NeoForge client for Minecraft ${profile.label}${profile.aliasNote ? " (${profile.aliasNote})" : ""}.",
            [":neoforge:runClient"],
            matrixProps(profile)
    )
}

tasks.register("buildNeo_1_21_0_to_1_21_2") {
    group = "build"
    description = "Compiles against NeoForge 1.21.0/1.21.1/1.21.2 and leaves a single final jar from the 1.21.0 profile."
    doLast {
        // Ensure only one final jar remains from the last (1.21.0) build step.
        delete(fileTree(dir: file('build/libs')))

        def profile1211 = neoProfiles.find { it.id == "1_21_1" }
        def profile1212 = neoProfiles.find { it.id == "1_21_2" }
        def profile1210 = neoProfiles.find { it.id == "1_21_0" }

        runGradleWithProfile([":common:compileJava", ":neoforge:compileJava"], matrixProps(profile1211))
        runGradleWithProfile([":common:compileJava", ":neoforge:compileJava"], matrixProps(profile1212))
        runGradleWithProfile([":neoforge:jar"], matrixProps(profile1210))
    }
}
